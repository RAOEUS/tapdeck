<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tapdeck - Rack &amp; Visualizer</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="app">
      <aside id="rack">
        <div id="brand"><img src="icons/active-48.png" alt="" /><span>Tapdeck</span></div>
        <div id="rackHeader">
          <h2>Rack</h2>
          <div id="addWrap">
            <button id="addBtn" aria-haspopup="true" aria-expanded="false">+ Add module</button>
            <div id="addMenu" hidden>
              <div class="addgroup">Tone</div>
              <button data-add="eq"><b>EQ</b><span>shape the frequency balance</span></button>
              <button data-add="sat"><b>Saturator</b><span>add harmonics &amp; warmth</span></button>
              <button data-add="trans"><b>Transient</b><span>shape punch &amp; sustain</span></button>
              <div class="addgroup">Dynamics</div>
              <button data-add="comp"><b>Compressor</b><span>even out the level</span></button>
              <button data-add="mbcomp"><b>Multiband</b><span>compress per frequency band</span></button>
              <button data-add="gate"><b>Gate</b><span>cut noise &amp; bleed below a threshold</span></button>
              <button data-add="limiter"><b>Limiter</b><span>brick-wall the peaks / ceiling</span></button>
              <div class="addgroup">Stereo &amp; cleanup</div>
              <button data-add="utility"><b>Utility</b><span>gain, pan, width, mono, crossfeed</span></button>
              <button data-add="denoise"><b>Denoise</b><span>reduce steady hiss &amp; hum</span></button>
              <div class="addgroup">Analysis</div>
              <button data-add="analyzer"><b>Scope</b><span>multi-resolution spectrogram</span></button>
            </div>
          </div>
        </div>
        <div id="presetBar">
          <button id="presetBrowse" title="Browse and apply rack presets">⊞ Browse presets</button>
          <button id="presetSave" title="Save this tab's rack as a preset">Save</button>
        </div>
        <ul id="moduleList"></ul>
        <div id="engineStatus"><span class="dot"></span><span id="engineText">Engine idle</span></div>
      </aside>

      <main id="editor">
        <div id="topbar">
          <span class="tb-label">Tabs</span>
          <div id="tabSwitcher"></div>
          <button id="masterBypass" class="tb-btn" title="Bypass all DSP for this tab (clean A/B of processed vs original)">Bypass tab</button>
          <button id="setDefault" class="tb-btn" title="Use this rack as the default for new tabs">Set as default</button>
        </div>
        <div id="moduleEditor"><p class="empty">Add or select a module.</p></div>
      </main>
    </div>
    <script src="dsp-math.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
